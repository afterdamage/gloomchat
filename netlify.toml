[build]
  command = "scripts/netlify-build.sh"
  publish = "build/web"

[build.environment]
  FLUTTER_VERSION = "3.41.3"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(*), microphone=(*), display-capture=(*), autoplay=(*)"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Branded invite landing page — serve before SPA fallback so /i/<id>
# is handled by the static landing page instead of the Flutter app shell.
[[redirects]]
  from = "/i/*"
  to = "/i/index.html"
  status = 200

# Privacy page route
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/privacy/"
  to = "/privacy.html"
  status = 200

# SPA fallback — serve index.html for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
